<svg xmlns="http://www.w3.org/2000/svg" width="300" height="220" viewBox="0 0 300 220" fill="none">
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf8f4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#d9f3ec" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5484d"/>
      <stop offset="1" stop-color="#a51d2d"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf4a"/>
      <stop offset="1" stop-color="#d98a0b"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2cc5ae"/>
      <stop offset="1" stop-color="#0d7a6f"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#5b48d6"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6efe9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#00241f" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Report sheet -->
  <g filter="url(#soft)" transform="rotate(-6 92 100)">
    <rect x="34" y="30" width="116" height="148" rx="12" fill="url(#sheet)"/>
    <rect x="34" y="30" width="116" height="30" rx="12" fill="#0d5c63"/>
    <rect x="34" y="48" width="116" height="12" fill="#0d5c63"/>
    <rect x="46" y="40" width="54" height="5" rx="2.5" fill="#ffffff" opacity="0.9"/>
    <rect x="46" y="49" width="34" height="4" rx="2" fill="#9fe3c9" opacity="0.9"/>
    <circle cx="132" cy="45" r="8" fill="#ffffff" opacity="0.15"/>
    <path d="M128.5 45.2l2.6 2.6 5-5.2" stroke="#9fe3c9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- rows -->
    <g fill="#12333a">
      <rect x="46" y="74" width="40" height="4" rx="2" opacity="0.55"/>
      <rect x="46" y="98" width="34" height="4" rx="2" opacity="0.55"/>
      <rect x="46" y="122" width="44" height="4" rx="2" opacity="0.55"/>
    </g>
    <g fill="#12333a">
      <rect x="116" y="74" width="22" height="4" rx="2" opacity="0.8"/>
      <rect x="116" y="98" width="22" height="4" rx="2" opacity="0.8"/>
      <rect x="116" y="122" width="22" height="4" rx="2" opacity="0.8"/>
    </g>
    <g>
      <rect x="46" y="84" width="92" height="4" rx="2" fill="#cdeee3"/>
      <rect x="62" y="84" width="58" height="4" rx="2" fill="#7fd8b8"/>
      <circle cx="96" cy="86" r="4" fill="#0d7a6f" stroke="#fff" stroke-width="1.5"/>
      <rect x="46" y="108" width="92" height="4" rx="2" fill="#cdeee3"/>
      <rect x="62" y="108" width="58" height="4" rx="2" fill="#7fd8b8"/>
      <circle cx="84" cy="110" r="4" fill="#0d7a6f" stroke="#fff" stroke-width="1.5"/>
      <rect x="46" y="132" width="92" height="4" rx="2" fill="#cdeee3"/>
      <rect x="62" y="132" width="58" height="4" rx="2" fill="#7fd8b8"/>
      <circle cx="104" cy="134" r="4" fill="#0d7a6f" stroke="#fff" stroke-width="1.5"/>
    </g>
    <rect x="46" y="152" width="60" height="4" rx="2" fill="#12333a" opacity="0.25"/>
    <rect x="46" y="160" width="40" height="4" rx="2" fill="#12333a" opacity="0.18"/>
  </g>

  <!-- Test tubes -->
  <g filter="url(#soft)">
    <!-- tube 1 -->
    <g>
      <rect x="160" y="40" width="20" height="10" rx="3" fill="#a51d2d"/>
      <path d="M162 50h16v100a8 8 0 0 1-16 0z" fill="url(#glass)" stroke="#bfe9dd" stroke-width="1.2"/>
      <path d="M163.5 96h13v54a6.5 6.5 0 0 1-13 0z" fill="url(#blood)"/>
      <rect x="165" y="56" width="2.5" height="80" rx="1.25" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- tube 2 -->
    <g>
      <rect x="188" y="52" width="20" height="10" rx="3" fill="#d98a0b"/>
      <path d="M190 62h16v88a8 8 0 0 1-16 0z" fill="url(#glass)" stroke="#bfe9dd" stroke-width="1.2"/>
      <path d="M191.5 104h13v46a6.5 6.5 0 0 1-13 0z" fill="url(#amber)"/>
      <rect x="193" y="68" width="2.5" height="68" rx="1.25" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- tube 3 -->
    <g>
      <rect x="216" y="44" width="20" height="10" rx="3" fill="#5b48d6"/>
      <path d="M218 54h16v96a8 8 0 0 1-16 0z" fill="url(#glass)" stroke="#bfe9dd" stroke-width="1.2"/>
      <path d="M219.5 92h13v58a6.5 6.5 0 0 1-13 0z" fill="url(#violet)"/>
      <rect x="221" y="60" width="2.5" height="76" rx="1.25" fill="#ffffff" opacity="0.8"/>
    </g>
    <!-- tube 4 -->
    <g>
      <rect x="244" y="58" width="20" height="10" rx="3" fill="#0d7a6f"/>
      <path d="M246 68h16v82a8 8 0 0 1-16 0z" fill="url(#glass)" stroke="#bfe9dd" stroke-width="1.2"/>
      <path d="M247.5 110h13v40a6.5 6.5 0 0 1-13 0z" fill="url(#teal)"/>
      <rect x="249" y="74" width="2.5" height="62" rx="1.25" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- rack -->
    <rect x="150" y="118" width="124" height="14" rx="5" fill="url(#rack)"/>
    <rect x="150" y="128" width="124" height="4" fill="#0d5c63" opacity="0.12"/>
    <rect x="156" y="132" width="6" height="40" rx="2" fill="#cfe9e2"/>
    <rect x="262" y="132" width="6" height="40" rx="2" fill="#cfe9e2"/>
    <rect x="146" y="168" width="132" height="14" rx="6" fill="url(#rack)"/>
    <rect x="146" y="178" width="132" height="4" rx="2" fill="#0d5c63" opacity="0.14"/>
  </g>

  <!-- droplet accent -->
  <path d="M270 22c5 7 8 11.5 8 15.5a8 8 0 0 1-16 0c0-4 3-8.5 8-15.5z" fill="url(#blood)" opacity="0.95"/>
  <circle cx="267" cy="38" r="1.8" fill="#ffffff" opacity="0.7"/>
</svg>
